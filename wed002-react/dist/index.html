<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Aryan Kapoor & Aarna Nair</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>#wed002-preloader{z-index:9999999;background-color:#892c4b;justify-content:center;align-items:center;width:100vw;height:100vh;transition:opacity .4s;display:flex;position:fixed;top:0;left:0}#wed002-preloader-flower-box{--box-size:18rem;height:var(--box-size);width:var(--box-size);justify-content:center;align-items:center;display:flex;position:relative}#wed002-preloader-flower-center{--box-size:4.8rem;height:var(--box-size);width:var(--box-size);z-index:4;background-color:#fb0;border-radius:50%;position:absolute}#wed002-flower-petail-area{justify-content:center;align-items:flex-start;width:100%;height:100%;display:flex;position:relative;top:0;left:0}.wed002-flower-petal{filter:invert();transform-origin:bottom;background:url(/assets/leafShape-CLwbFqNT.svg) 50%/contain no-repeat;border-radius:50%;width:34%;height:49%;position:absolute}.wed002-flower-petal:nth-child(2){transform-origin:bottom;transform:rotate(45deg)}.wed002-flower-petal:nth-child(3){transform-origin:bottom;transform:rotate(90deg)}.wed002-flower-petal:nth-child(4){transform-origin:bottom;transform:rotate(135deg)}.wed002-flower-petal:nth-child(5){transform-origin:bottom;transform:rotate(180deg)}.wed002-flower-petal:nth-child(6){transform-origin:bottom;transform:rotate(225deg)}.wed002-flower-petal:nth-child(7){transform-origin:bottom;transform:rotate(270deg)}.wed002-flower-petal:nth-child(8){transform-origin:bottom;transform:rotate(315deg)}</style>
    <script type="module" crossorigin src="/assets/index-_ZmSccra.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CAVSHSnZ.css">
  </head>
  <body>
    <div id="wed002-preloader">
      <div id="wed002-preloader-flower-box">
        <div id="wed002-flower-petail-area">
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
          <div class="wed002-flower-petal"></div>
        </div>
        <div id="wed002-preloader-flower-center"></div>
      </div>
    </div>
    <script>
      (function() {
        function dismissPreloader() {
          var p = document.getElementById('wed002-preloader');
          if (p && p.style.display !== 'none') {
            p.style.opacity = '0';
            setTimeout(function() {
              p.style.display = 'none';
            }, 400);
          }
        }
        var fallbackTimer = setTimeout(dismissPreloader, 3400);
        function playAnimation() {
          if (typeof gsap !== 'undefined') {
            gsap.timeline({
              onComplete: function() {
                clearTimeout(fallbackTimer);
                dismissPreloader();
              }
            })
            .from("#wed002-preloader-flower-center", {scale: 0, duration: 0.4, delay: 0.1, ease: "back"})
            .from(".wed002-flower-petal", {scale: 0, stagger: 0.12, duration: 0.45, ease: "back"})
            .to("#wed002-flower-petail-area", {rotate: 360, duration: 1.1, ease: "power1.inOut"})
            .to("#wed002-flower-petail-area", {scale: 1.15, duration: 0.25})
            .to("#wed002-flower-petail-area", {scale: 0, duration: 0.35, delay: 0.1})
            .to("#wed002-preloader-flower-center", {scale: 0, duration: 0.25});
          } else {
            dismissPreloader();
          }
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', playAnimation);
        } else {
          playAnimation();
        }
      })();
    </script>
    <div id="root"></div>
  </body>
</html>
